<!doctype html>
<!--
  Confirm page of "Connect Steam" (supabase/functions/steam-link). After someone
  signs in through Steam, steam-link sends the browser here with a token after
  `#`: the sign-in's state and the Steam ID Steam confirmed, signed. Nothing is
  saved yet. The page shows which Gamebit member the link was started from,
  and saves only when the person who signed in to Steam presses Link Steam.
  That stops someone from starting a link and getting another person to finish
  it, which would put that person's Steam account on their profile.

  steam-link uses it once its STEAM_LINK_CONFIRM_URL is this page's address
  (unset, it saves the Steam ID without asking). Supabase serves a function's
  HTML as plain text, so the page lives with the web app (`flutter build web`
  copies it into build/web). It is plain HTML, with no Flutter, so it opens
  quickly in a phone's in-app browser tab too.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Connect Steam - Gamebit</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #121212;
      --surface: #1c1c1e;
      --outline: #3a3a3f;
      --text: #ececf0;
      --muted: #9b9ba5;
      --accent: #bb86fc;
      --on-accent: #22103a;
      --warning: #ffc857;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--background);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 440px; }
    .brand { margin: 0 0 24px; color: var(--muted); font-size: 0.875rem; letter-spacing: 0.04em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.25; }
    p { margin: 0 0 16px; }
    .muted { color: var(--muted); }
    .member {
      margin: 0 0 16px;
      padding: 16px;
      border: 1px solid var(--outline);
      border-radius: 12px;
      background: var(--surface);
      overflow-wrap: anywhere;
    }
    .member strong { display: block; font-size: 1.25rem; }
    .warning { color: var(--warning); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    button {
      min-height: 44px;
      padding: 10px 20px;
      border: 1px solid var(--outline);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
    button:disabled { opacity: 0.5; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Gamebit</p>
    <h1 id="title">Connect Steam</h1>
    <p id="message" role="status">Checking your Steam sign-in…</p>
    <div id="ask" hidden>
      <div class="member">
        <strong id="handle"></strong>
        <span id="name" class="muted"></span>
      </div>
      <p class="warning">
        Only continue if this is your own Gamebit account. If someone sent you a
        link to sign in through Steam, cancel: linking gives that account your
        Steam library, playtime and achievements.
      </p>
    </div>
    <div class="actions">
      <button id="link" class="primary" type="button" hidden>Link Steam</button>
      <button id="cancel" type="button" hidden>Cancel</button>
      <button id="retry" type="button" hidden>Try again</button>
    </div>
  </main>
  <script>
    'use strict';
    (() => {
      // steam-link, the function this page asks. Running your own backend?
      // Change it with the Supabase URL in lib/main.dart.
      const FUNCTION_URL = 'https://nmbarqhvcjgyuwreebda.supabase.co/functions/v1/steam-link';

      const MESSAGES = {
        STEAM_LINK_EXPIRED: 'This Steam sign-in took too long. Go back to Gamebit and connect Steam again.',
        BAD_REQUEST: 'This Steam sign-in link is not valid. Go back to Gamebit and connect Steam again.',
        NOT_CONFIGURED: 'Connecting Steam is not available right now.',
        INTERNAL: 'Something went wrong on our side. Go back to Gamebit and try again later.',
      };
      const OFFLINE = "Couldn't reach Gamebit. Check your connection and try again.";

      const $ = (id) => document.getElementById(id);
      const fragment = new URLSearchParams(location.hash.slice(1));
      const token = fragment.get('t');
      // The token stays out of the history and of anything that reads the
      // address from here on.
      history.replaceState(null, '', location.pathname + location.search);

      const isLoopback = (url) => url.protocol === 'http:' &&
        ['127.0.0.1', 'localhost', '[::1]'].includes(url.hostname);
      const parse = (text) => {
        try {
          return new URL(text);
        } catch (_) {
          return null;
        }
      };
      // The address steam-link gives is taken only on this computer (`supabase
      // start`): anywhere else this page asks its own backend.
      const given = parse(fragment.get('f') || '');
      const functionUrl = given && isLoopback(given) ? given.href : FUNCTION_URL;

      function show({ title, message, ask = false, buttons = [] }) {
        if (title) $('title').textContent = title;
        $('message').textContent = message;
        $('ask').hidden = !ask;
        for (const id of ['link', 'cancel', 'retry']) {
          $(id).hidden = !buttons.includes(id);
          $(id).disabled = false;
        }
      }

      // Back to the app that started the link (web, or the desktop app on this
      // computer), with how it ended. Null: a phone app, which sees it on the
      // profile.
      function goBack(address) {
        const url = address ? parse(address) : null;
        if (url && (url.protocol === 'https:' || isLoopback(url))) {
          location.replace(url.href);
          return true;
        }
        return false;
      }

      async function ask(body) {
        let res;
        try {
          res = await fetch(functionUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, ...body }),
            credentials: 'omit',
            cache: 'no-store',
            referrerPolicy: 'no-referrer',
          });
        } catch (_) {
          return null;
        }
        let data = {};
        try {
          data = (await res.json()) || {};
        } catch (_) {}
        return { ok: res.ok, data };
      }

      function failed(data) {
        show({
          title: 'Steam was not connected',
          message: MESSAGES[data.code] || MESSAGES.INTERNAL,
        });
        goBack(data.return_to);
      }

      let cancelTo = null;

      async function describe() {
        show({ message: 'Checking your Steam sign-in…' });
        const answer = await ask({});
        if (answer === null) return show({ title: 'Connect Steam', message: OFFLINE, buttons: ['retry'] });
        if (!answer.ok) return failed(answer.data);

        const { handle, name } = answer.data;
        cancelTo = answer.data.cancel_to || null;
        $('handle').textContent = handle ? `@${handle}` : name || 'A Gamebit account with no name';
        $('name').textContent = handle && name ? name : '';
        show({
          title: 'Link Steam to this Gamebit account?',
          message: 'You signed in to Steam. Gamebit will save that Steam account on this profile:',
          ask: true,
          buttons: ['link', 'cancel'],
        });
        $('link').focus();
      }

      async function link() {
        $('link').disabled = true;
        $('cancel').disabled = true;
        const answer = await ask({ confirm: true });
        if (answer === null) {
          show({
            title: 'Link Steam to this Gamebit account?',
            message: OFFLINE,
            ask: true,
            buttons: ['link', 'cancel'],
          });
          return;
        }
        if (!answer.ok) return failed(answer.data);
        show({
          title: 'Steam connected',
          message: 'You can close this page and go back to Gamebit.',
        });
        goBack(answer.data.return_to);
      }

      function cancel() {
        show({
          title: 'Steam was not connected',
          message: 'You can close this page and go back to Gamebit.',
        });
        goBack(cancelTo);
      }

      $('link').addEventListener('click', link);
      $('cancel').addEventListener('click', cancel);
      $('retry').addEventListener('click', describe);

      if (!token) {
        show({ title: 'Steam was not connected', message: MESSAGES.BAD_REQUEST });
      } else {
        describe();
      }
    })();
  </script>
</body>
</html>
