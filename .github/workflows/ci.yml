name: CI

# Lints and tests the app on every pull request and every push to main.
# The Supabase side (migrations + Edge Functions) is deployed by
# deploy-supabase.yml.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # analysis_options.yaml includes flutter_lints; any finding fails the build.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  edge-functions:
    name: Type-check Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # supabase/config.toml: [edge_runtime] deno_version = 2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check
        run: deno check supabase/functions/*/index.ts

      # Rate-limit backoff and the background-sync schedule (supabase/functions/_shared).
      - name: Test shared helpers
        run: deno test --allow-read=supabase/migrations supabase/functions/_shared/

  migrations:
    name: Check migration names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # `supabase db push` applies migrations in file-name order and refuses a new
      # one that sorts before a migration the database already has. A file dated
      # ahead makes every migration written before that date sort before it, so
      # take the name `supabase migration new` gives (now, in UTC).
      - name: No migration is dated in the future
        run: |
          limit=$(date -u -d '+1 hour' +%Y%m%d%H%M%S)
          status=0
          seen=""
          for f in supabase/migrations/*.sql; do
            name=$(basename "$f")
            stamp=${name%%_*}
            if ! [[ $stamp =~ ^[0-9]{14}$ ]]; then
              echo "::error file=$f::$name must start with a 14-digit UTC timestamp (YYYYMMDDHHMMSS)"
              status=1
              continue
            fi
            if [[ $stamp > $limit ]]; then
              echo "::error file=$f::$name is dated in the future. Rename it with the current UTC time, as \`supabase migration new\` does."
              status=1
            fi
            if [[ " $seen " == *" $stamp "* ]]; then
              echo "::error file=$f::Another migration already uses the timestamp $stamp"
              status=1
            fi
            seen="$seen $stamp"
          done
          exit $status
