name: Deploy Supabase

# Applies new database migrations and deploys the Edge Functions when something
# under supabase/ changes on main. Can also be started by hand from the Actions tab.
#
# One-time setup (GitHub: Settings > Secrets and variables > Actions):
#   secret   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com/dashboard/account/tokens)
#   secret   SUPABASE_DB_PASSWORD    the project's database password
#   variable SUPABASE_PROJECT_ID     the project ref (Project Settings > General)
# Function secrets (STEAM_API_KEY, TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET) live in
# Supabase itself (`supabase secrets set`) and are not touched here.
#
# The deploy job runs in the "production" environment. Add required reviewers to
# that environment (Settings > Environments) if migrations should wait for a
# human: a migration runs against the live database as soon as the job starts.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

# Never run two deploys at once, and never cancel one half way through.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Type-check Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno check supabase/functions/*/index.ts

      - run: deno test --allow-read=supabase/migrations supabase/functions/_shared/

  deploy:
    name: Migrations and functions
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Fail early when the setup is missing
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (see the comment at the top of this workflow)"
              exit 1
            fi
          done

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Lists what is about to run, so it is in the log before it happens.
      - name: Pending migrations
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy
